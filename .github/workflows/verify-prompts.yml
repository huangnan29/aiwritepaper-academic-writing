name: Verify compiled prompts

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # ReportLab依赖hashlib的usedforsecurity参数，运行时基线为Python 3.9+。
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
      - name: 安装真实PDF回归依赖
        run: uv pip install pypdf reportlab
      - name: 校验提示词与路由同步
        run: uv run python scripts/verify_compiled.py
      - name: 校验图表包机械门禁
        run: uv run python -m unittest discover -s tests -p 'test_*.py'

  svg-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 校验SVG布局编译器
        run: node --test tests/test_render_svg_layout.mjs
